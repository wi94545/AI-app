<!DOCTYPE html>
<html lang="zh-TW">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>幸運轉盤 Wheel of Fortune</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css?v=2">
</head>

<body>
    <div class="app-container">
        <!-- Dashboard / Controls -->
        <div class="controls-panel">
            <header>
                <h1>幸運轉盤</h1>
                <p>輸入選項，試試手氣！</p>
            </header>

            <div class="category-control">
                <select id="categorySelect">
                    <option value="drinks">🧋 飲料</option>
                    <option value="food">🍱 食物</option>
                    <option value="lottery">🎁 抽獎</option>
                </select>
            </div>

            <div class="input-group">
                <div class="input-wrapper">
                    <input type="text" id="itemInput" placeholder="輸入選項 或 選擇預設..." maxlength="20" autocomplete="off">
                    <span id="dropdownToggle" class="dropdown-arrow">▼</span>
                    <ul id="suggestionsList" class="suggestions-list hidden"></ul>
                </div>
                <button id="addItemBtn">新增</button>
            </div>

            <div class="items-list-container">
                <h3>選項列表 <span id="itemCount">(0)</span></h3>
                <p class="weight-instruction">💡 提示：輸入數字可調整權重 (預設 1)，數字越大格子越大！</p>
                <ul id="itemsList">
                    <!-- Items will be added here by JS -->
                </ul>
            </div>
        </div>

        <!-- Wheel Display -->
        <div class="wheel-panel">
            <div class="wheel-container">
                <div class="pointer"></div>
                <canvas id="wheelCanvas" width="500" height="500"></canvas>
                <div class="center-circle">
                    <button id="spinBtn">SPIN</button>
                </div>
            </div>
        </div>

        <!-- History Panel (Right) -->
        <div class="history-panel">
            <h2>📜 歷史紀錄</h2>
            <div class="history-list-container">
                <ul id="historyList">
                    <!-- History items will be added here -->
                </ul>
            </div>
        </div>
    </div>

    <!-- Winner Modal -->
    <div id="winnerModal" class="modal hidden">
        <div class="modal-content">
            <h2>🎉 結果出爐！ 🎉</h2>
            <p class="winner-text" id="winnerText">...</p>
            <button id="closeModalBtn">太棒了</button>
        </div>
    </div>

    <script type="module" src="script.js?v=4"></script>
</body>

</html>
